<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anonymous Tips</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 20px;
        color: #080707;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
      table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #0cbcf1;
        color: white;
      }
      button {
        padding: 5px 10px;
        border: none;
        border-radius: 5px;
        background-color: #f44336;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background-color: #d32f2f;
      }
      .refresh {
        display: inline-block;
        margin-top: 30px;
        margin-bottom: 15px;
        padding: 8px 14px;
        color: white;
        background-color: #2196f3;
        text-decoration: none;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .back {
        display: inline-block;
        margin-top: 10px;
        margin-bottom: 60px;
        padding: 8px 16px;
        color: white;
        background-color: #2196f3;
        text-decoration: none;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Anonymous Tips</h1>
    <table>
      <tr>
        <th>Tip</th>
        <th>Action</th>
      </tr>
      {% for tip in tips %}
      <tr>
        <td>{{ tip }}</td>
        <td>
          <form method="post" action="/delete_tip">
            <input type="hidden" name="tip" value="{{ tip }}" />
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
    <div style="text-align: center">
      <a class="refresh" href="/tips">Refresh</a>

    <div style ="text-align: center;">
      <a class="back" href="/">Back to Chatbot</a>
    </div>

    </div>
  </body>
</html>
